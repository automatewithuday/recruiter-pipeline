[project]
name = "jd2candidates"
version = "0.1.0"
description = "JD in, tiered LinkedIn candidate list out"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
jd2candidates = "jd2candidates.cli:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
